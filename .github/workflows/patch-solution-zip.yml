name: Patch CRM solution ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch workflow inside solution ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tempfile
          import shutil
          import xml.etree.ElementTree as ET

          zip_path = Path('MCTransfer_1_0_0_0.zip')
          xaml_path = Path('Workflows/2P-MainNotification-Customer-33D4C37F-57B2-4AE5-A419-7AB67AB64530.xaml')
          target_name = xaml_path.name

          source = xaml_path.read_bytes()
          ET.fromstring(source)

          with ZipFile(zip_path, 'r') as zin:
              matches = [n for n in zin.namelist() if Path(n).name == target_name]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one target XAML in ZIP, found {len(matches)}: {matches}')
              target = matches[0]
              print(f'ZIP target: {target}')

              with tempfile.TemporaryDirectory() as td:
                  root_dir = Path(td) / 'solution'
                  root_dir.mkdir()
                  zin.extractall(root_dir)
                  (root_dir / target).write_bytes(source)

                  new_zip = Path(td) / 'patched.zip'
                  with ZipFile(new_zip, 'w') as zout:
                      for info in zin.infolist():
                          zout.writestr(info, (root_dir / info.filename).read_bytes())
                  shutil.copy2(new_zip, zip_path)

          # Verify the actual binary package after patching.
          with ZipFile(zip_path, 'r') as z:
              data = z.read(target)
          root = ET.fromstring(data)

          def lname(tag):
              return tag.rsplit('}', 1)[-1]

          sends = [
              e for e in root.iter()
              if lname(e.tag) == 'ActivityReference'
              and 'SendSmsNotificationActivity' in e.attrib.get('AssemblyQualifiedName', '')
          ]
          sms = [
              e for e in root.iter()
              if lname(e.tag) == 'Sequence'
              and e.attrib.get('DisplayName', '').startswith('CreateStep')
              and any(lname(c.tag) == 'CreateEntity' and c.attrib.get('EntityName') == 'crm2p_sms' for c in e.iter())
          ]
          generated_numbers = []
          for e in sms:
              name = e.attrib.get('DisplayName', '')
              if name.startswith('CreateStep'):
                  try:
                      n = int(name[len('CreateStep'):])
                      if 425 <= n <= 465:
                          generated_numbers.append(n)
                  except ValueError:
                      pass

          if len(sends) != 41:
              raise SystemExit(f'ZIP verification failed: SendSms={len(sends)}')
          if len(sms) != 42:
              raise SystemExit(f'ZIP verification failed: total crm2p_sms={len(sms)}')
          if sorted(generated_numbers) != list(range(425, 466)):
              raise SystemExit(f'ZIP verification failed: generated CreateSteps={sorted(generated_numbers)}')

          print('ZIP verification PASSED')
          print(f'SendSmsNotificationActivity: {len(sends)}')
          print('Generated CreateStep425-465: 41')
          print('Total crm2p_sms CreateSteps: 42')
          PY

      - name: Commit patched solution ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MCTransfer_1_0_0_0.zip
          if git diff --cached --quiet; then
            echo "Solution ZIP already contains the patched workflow."
            exit 0
          fi
          git commit -m "fix: patch workflow inside CRM solution package"
          git push
