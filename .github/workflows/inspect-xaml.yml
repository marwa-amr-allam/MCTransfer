name: Inspect original workflow XAML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect XAML
        shell: bash
        run: |
          git show cddb47f6643216889941ff4e32eef464bf0d39b0:Workflows/2P-MainNotification-Customer-33D4C37F-57B2-4AE5-A419-7AB67AB64530.xaml > /tmp/original.xaml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('/tmp/original.xaml')
          root=ET.parse(p).getroot()
          def lname(tag): return tag.rsplit('}',1)[-1]
          sends=[]
          def walk(e):
              if lname(e.tag)=='ActivityReference' and 'SendSmsNotificationActivity' in e.attrib.get('AssemblyQualifiedName',''):
                  sends.append(e)
              for c in list(e): walk(c)
          walk(root)
          out=[f'SEND COUNT={len(sends)}']
          for e in sends[:5]:
              parent=None
              for candidate in root.iter():
                  if e in list(candidate): parent=candidate; break
              out.append('SEND '+str(e.attrib.get('DisplayName')))
              out.append(' parent='+lname(parent.tag) if parent is not None else ' parent=None')
              if parent is not None:
                  out.append(' parent_children='+repr([(lname(x.tag),x.attrib.get('DisplayName',''),x.attrib.get('AssemblyQualifiedName','')) for x in list(parent)]))
          found=[e for e in root.iter() if e.attrib.get('DisplayName')=='CreateStep424']
          out.append(f'CREATE424 COUNT={len(found)}')
          if found:
              e=found[0]
              out.append('CREATE424 TAG='+lname(e.tag))
              out.append('CREATE424 CHILDREN='+repr([(lname(x.tag),x.attrib.get('DisplayName',''),x.attrib.get('AssemblyQualifiedName','')) for x in list(e)]))
              for x in e.iter():
                  if lname(x.tag)=='CreateEntity': out.append('CREATEENTITY ATTRS='+repr(x.attrib))
          Path('inspection.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Publish inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection.txt
          git commit -m "chore: record original XAML inspection"
          git push
