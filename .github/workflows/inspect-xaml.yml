name: Repair CRM workflow XAML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair generated CRM SMS variables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path('Workflows/2P-MainNotification-Customer-33D4C37F-57B2-4AE5-A419-7AB67AB64530.xaml')
          text = path.read_text(encoding='utf-8')

          start_tag = '<mxswa:Workflow.Variables>'
          end_tag = '</mxswa:Workflow.Variables>'
          start = text.find(start_tag)
          end = text.find(end_tag, start)
          if start < 0 or end < 0:
              raise SystemExit('Workflow.Variables block not found')

          block = text[start:end]
          pattern = re.compile(
              r'^[ \\t]*<Variable\\b[^>]*\\bName="CreateStep(?:42[5-9]|4[3-5]\\d|46[0-5])_[1-7]"[^>]*/>[ \\t]*\\n?',
              re.MULTILINE,
          )
          fixed_block, removed = pattern.subn('', block)
          fixed = text[:start] + fixed_block + text[end:]

          # Parse after editing so a malformed workflow can never be committed.
          root = ET.fromstring(fixed)

          sends = [
              e for e in root.iter()
              if e.tag.rsplit('}', 1)[-1] == 'ActivityReference'
              and 'SendSmsNotificationActivity' in e.attrib.get('AssemblyQualifiedName', '')
          ]
          sms_sequences = [
              e.attrib.get('DisplayName')
              for e in root.iter()
              if e.tag.rsplit('}', 1)[-1] == 'Sequence'
              and e.attrib.get('DisplayName', '').startswith('CreateStep')
              and any(
                  c.tag.rsplit('}', 1)[-1] == 'CreateEntity'
                  and c.attrib.get('EntityName') == 'crm2p_sms'
                  for c in e.iter()
              )
          ]
          generated = [
              n for n in sms_sequences
              if n and re.fullmatch(r'CreateStep(?:42[5-9]|4[3-5]\\d|46[0-5])', n)
          ]

          workflow = next(e for e in root.iter() if e.tag.rsplit('}', 1)[-1] == 'Workflow')
          workflow_vars = next(e for e in workflow if e.tag.rsplit('}', 1)[-1] == 'Variables')
          remaining = [
              e.attrib.get('Name') for e in workflow_vars
              if re.fullmatch(r'CreateStep(?:42[5-9]|4[3-5]\\d|46[0-5])_[1-7]', e.attrib.get('Name', ''))
          ]

          if len(sends) != 41:
              raise SystemExit(f'Expected 41 SendSms activities, found {len(sends)}')
          if len(generated) != 41:
              raise SystemExit(f'Expected 41 generated crm2p_sms steps, found {len(generated)}')
          if len(sms_sequences) != 42:
              raise SystemExit(f'Expected 42 total crm2p_sms steps including CreateStep424, found {len(sms_sequences)}')
          if remaining:
              raise SystemExit(f'Generated workflow variables remain: {len(remaining)}')

          path.write_text(fixed, encoding='utf-8')
          print(f'Removed generated workflow variables: {removed}')
          print(f'SendSmsNotificationActivity: {len(sends)}')
          print(f'Generated CreateStep425-465: {len(generated)}')
          print(f'Total crm2p_sms CreateSteps: {len(sms_sequences)}')
          print('XML validation: PASSED')
          print('Generated workflow-level variables remaining: 0')
          PY

      - name: Commit repaired XAML
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Workflows/2P-MainNotification-Customer-33D4C37F-57B2-4AE5-A419-7AB67AB64530.xaml
          if git diff --cached --quiet; then
            echo "No XAML changes needed."
            exit 0
          fi
          git commit -m "fix: remove invalid workflow-level SMS variables"
          git push
