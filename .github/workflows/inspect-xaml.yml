name: Inspect original workflow XAML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cddb47f6643216889941ff4e32eef464bf0d39b0
      - name: Inspect XAML
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('Workflows/2P-MainNotification-Customer-33D4C37F-57B2-4AE5-A419-7AB67AB64530.xaml')
          root=ET.parse(p).getroot()
          def lname(tag): return tag.rsplit('}',1)[-1]
          sends=[]
          def walk(e,path='root'):
              if lname(e.tag)=='ActivityReference' and 'SendSmsNotificationActivity' in e.attrib.get('AssemblyQualifiedName',''):
                  sends.append((e,path,e.attrib.get('DisplayName')))
              for i,c in enumerate(list(e)):
                  walk(c,path+'/'+lname(e.tag)+f'[{i}]')
          walk(root)
          out=[]
          out.append(f'SEND COUNT={len(sends)}')
          for e,path,name in sends[:5]:
              parent=None
              for candidate in root.iter():
                  if e in list(candidate): parent=candidate; break
              out.append('SEND '+str(name))
              out.append(' parent='+lname(parent.tag) if parent is not None else ' parent=None')
              if parent is not None:
                  out.append(' parent_children='+repr([(lname(x.tag),x.attrib.get('DisplayName',''),x.attrib.get('AssemblyQualifiedName','')) for x in list(parent)]))
          found=[e for e in root.iter() if e.attrib.get('DisplayName')=='CreateStep424']
          out.append(f'CREATE424 COUNT={len(found)}')
          if found:
              e=found[0]
              out.append('CREATE424 TAG='+lname(e.tag))
              out.append('CREATE424 CHILDREN='+repr([(lname(x.tag),x.attrib.get('DisplayName',''),x.attrib.get('AssemblyQualifiedName','')) for x in list(e)]))
              for x in e.iter():
                  if lname(x.tag)=='CreateEntity':
                      out.append('CREATEENTITY ATTRS='+repr(x.attrib))
          Path('/tmp/inspection.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
      - name: Publish inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/inspection.txt inspection.txt
          git add inspection.txt
          git commit -m "chore: record original XAML inspection"
          git push
