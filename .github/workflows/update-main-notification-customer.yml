name: Update Main Notification Customer

on:
  push:

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect XAML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,re
          base='https://api.github.com/repos/marwa-amr-allam/MCTransfer'; path='Workflows/2P-MainNotification-Customer-33D4C37F-57B2-4AE5-A419-7AB67AB64530.xaml'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'inspect'}
          with urllib.request.urlopen(urllib.request.Request(f'{base}/contents/{path}?ref=main',headers=h)) as r:m=json.load(r)
          with urllib.request.urlopen(urllib.request.Request(f'{base}/git/blobs/{m["sha"]}',headers=h)) as r:b=json.load(r)
          s=base64.b64decode(b['content']).decode()
          for term in ['x:Key="Message"','CustomActivityStep380_5_converted','SendSmsNotificationActivity']:
              print('TERM',term,'COUNT',s.count(term))
              i=s.find(term)
              print(repr(s[max(0,i-500):i+1000]) if i>=0 else 'NOT FOUND')
          PY
