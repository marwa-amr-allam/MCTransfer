name: Replace Case Word - Employee Workflow

on:
  push:
    paths:
      - '.github/workflows/replace-case-word-employee.yml'

jobs:
  replace-word:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Arabic wording
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('Workflows/2P-MainNotification-Employee-5C9604F9-6961-436E-A7BA-B9A551179AB2.xaml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'القضية': 'الشكوى',
              '&#1575;&#1604;&#1602;&#1590;&#1610;&#1577;': '&#1575;&#1604;&#1588;&#1603;&#1608;&#1609;',
              '&amp;#1575;&amp;#1604;&amp;#1602;&amp;#1590;&amp;#1610;&amp;#1577;': '&amp;#1575;&amp;#1604;&amp;#1588;&amp;#1603;&amp;#1608;&amp;#1609;',
          }

          total = 0
          for old, new in replacements.items():
              count = text.count(old)
              print(f'Occurrences of {old}: {count}')
              if count:
                  text = text.replace(old, new)
                  total += count

          print(f'Total replacements: {total}')
          if total == 0:
              raise SystemExit('No known representation of القضية found in employee workflow.')

          path.write_text(text, encoding='utf-8')
          ET.parse(path)
          print('XAML XML validation: OK')

      - name: Commit employee workflow change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Workflows/2P-MainNotification-Employee-5C9604F9-6961-436E-A7BA-B9A551179AB2.xaml
          git commit -m 'fix: use الشكوى instead of القضية in employee emails'
          git push
